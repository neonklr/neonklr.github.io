<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Anatomy of a Capture</title>
    <meta name="description" content="A scroll-driven presentation on the 2007 Shatt al-Arab incident.">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <canvas class="starfield" data-starfield aria-hidden="true"></canvas>
    <div class="ambient-grid" aria-hidden="true"></div>
    <div class="noise-layer" aria-hidden="true"></div>

    <header class="deck-hud" aria-label="Presentation status">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <span>Shatt al-Arab Incident</span>
      </div>
      <div class="deck-counter" aria-live="polite">
        <span data-current>01</span><b>/</b><span data-total>15</span>
      </div>
      <div class="progress-shell" aria-hidden="true">
        <div class="progress-bar" data-progress></div>
      </div>
    </header>

    <main class="stage" data-stage></main>
    <nav class="slide-nav" data-nav aria-label="Slide navigation"></nav>

    <aside class="speaker-notes" aria-live="polite">
      <strong>Presenter note</strong>
      <span data-notes></span>
    </aside>

    <script src="presentation-data.js"></script>
    <script src="components.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        window.PresentationComponents.renderPresentation(window.presentationSlides);
      });
    </script>
  </body>
</html>
